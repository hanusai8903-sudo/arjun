<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arjun</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }
      .card {
        text-align: center;
        padding: 3rem 4rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.7);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 5vw, 4rem);
      }
      p {
        margin: 0;
        opacity: 0.8;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>arjun</h1>
      <p>GitHub Pages ready</p>
    </div>
  </body>
</html>
